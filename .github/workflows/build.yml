name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install FreeRDP
        run: brew install freerdp

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: ./build.sh dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeRDPClient-DMG
          path: build/*.dmg
          if-no-files-found: error
